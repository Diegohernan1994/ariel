<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>Ariel — Acceso privado</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"><script src="/auth-ui.js" defer></script><style>*{box-sizing:border-box;border-radius:0}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#fafafa;color:#171717;font:14px Poppins,system-ui,sans-serif;padding:24px}main{width:100%;max-width:420px;background:#fff;border:1px solid #e5e5e5;padding:32px}h1{font-size:24px;margin:0 0 12px}p{color:#666;line-height:1.6}label{display:block;margin-top:18px}input{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #ddd;font:inherit}button{width:100%;padding:12px;background:#171717;color:white;border:0;margin-top:24px;font:inherit;cursor:pointer}button:disabled{opacity:.5}#auth-error{color:#a32828}[hidden]{display:none!important}</style></head>
<body data-mode="__MODE__" data-csrf="__CSRF__"><main><h1 id="auth-title">Ingresar a Ariel</h1><p id="auth-description">Acceso privado a tu panel comercial.</p><form id="auth-form"><label>Usuario<input name="username" autocomplete="username" required maxlength="64"></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required maxlength="512"></label><label id="auth-confirm-label" hidden>Repetí la contraseña<input name="confirmPassword" type="password" autocomplete="new-password" maxlength="512"></label><p id="auth-error" role="alert"></p><button id="auth-submit">Ingresar</button></form></main></body></html>
